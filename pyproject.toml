[tool.poetry]
name = "campus-admin"
version = "0.1.3"
description = "Campus admin portal"
authors = ["NYJC Computing <nyjc.computing@nyjc.edu.sg>"]
readme = "README.md"
packages = [{include = "apps/admin"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
flask = "^3.0.0"
# WSGI server (Procfile) - was transitive via campus-suite until #993
gunicorn = "^26.2.0"

# Campus internal dependencies
# Typed API client - v0.10.12 (explicit ?resolve= on every membership probe, sdk#183 — invariant across the campus#1207 default flip; v0.10.11 shipped members.resolve + api.users.roles, campus#1202)
campus-api-python = {url = "https://github.com/nyjc-computing/campus-api-python/releases/download/v0.11.2/campus_api_python-0.11.2-py3-none-any.whl"}
# Flask consumer layer (flask_campus + audit middleware/client/http) - v0.2.3 (pure repin to SDK v0.10.12; v0.2.2 made circles.is_member resolve transitively via the server's shared resolver — gate parity, campus#1202/#1207/#88); the suite is no longer a runtime dep (campus#993)
flask-campus = {url = "https://github.com/nyjc-computing/flask-campus/releases/download/v0.2.7/flask_campus-0.2.7-py3-none-any.whl"}
campus-common = {url = "https://github.com/nyjc-computing/campus-common/releases/download/v0.5.1/campus_common-0.5.1-py3-none-any.whl"}
python-dotenv = "^1.2.1"

[dependency-groups]
dev = [
    "playwright (>=1.57.0,<2.0.0)",
    "ruff (>=0.16.9,<0.17.0)"
]

[tool.pyright]
# https://github.com/microsoft/pyright/blob/main/docs/configuration.md
useLibraryCodeForTypes = true
exclude = [".cache"]

[tool.ruff]
# https://beta.ruff.rs/docs/configuration/
select = ['E', 'W', 'F', 'I', 'B', 'C4', 'ARG', 'SIM']
ignore = ['W291', 'W292', 'W293']

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
