[tool.poetry]
name = "campus-untitled"
version = "0.1.0"
description = "A Campus application"
authors = ["Anynymous <anonymous@email.com>"]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
flask = "^3.0.0"

# Campus internal dependencies
campus-api-python = {git = "https://github.com/nyjc-computing/campus-api-python.git", branch = "main"}

[tool.pyright]
# https://github.com/microsoft/pyright/blob/main/docs/configuration.md
useLibraryCodeForTypes = true
exclude = [".cache"]

[tool.ruff]
# https://beta.ruff.rs/docs/configuration/
select = ['E', 'W', 'F', 'I', 'B', 'C4', 'ARG', 'SIM']
ignore = ['W291', 'W292', 'W293']

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"