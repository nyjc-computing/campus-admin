[tool.poetry]
name = "campus-admin"
version = "0.1.1"
description = "Campus admin portal"
authors = ["NYJC Computing <nyjc.computing@nyjc.edu.sg>"]
readme = "README.md"
packages = [{include = "apps/admin"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
flask = "^3.0.0"

# Campus internal dependencies
campus-api-python = {git = "https://github.com/nyjc-computing/campus-api-python.git", branch = "main"}
# Flask consumer layer (flask_campus + audit middleware) - the suite is no longer a runtime dep (campus#993)
flask-campus = {url = "https://github.com/nyjc-computing/flask-campus/releases/download/v0.1.1/flask_campus-0.1.1-py3-none-any.whl"}
campus-common = {url = "https://github.com/nyjc-computing/campus-common/releases/download/v0.3.1/campus_common-0.3.1-py3-none-any.whl"}
python-dotenv = "^1.2.1"

[dependency-groups]
dev = [
    "playwright (>=1.57.0,<2.0.0)",
    "ruff (>=0.16.9,<0.17.0)"
]

[tool.pyright]
# https://github.com/microsoft/pyright/blob/main/docs/configuration.md
useLibraryCodeForTypes = true
exclude = [".cache"]

[tool.ruff]
# https://beta.ruff.rs/docs/configuration/
select = ['E', 'W', 'F', 'I', 'B', 'C4', 'ARG', 'SIM']
ignore = ['W291', 'W292', 'W293']

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
