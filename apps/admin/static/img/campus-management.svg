<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-label="Campus Management">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d6efd"/>
      <stop offset="1" stop-color="#0a3d91"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <circle cx="520" cy="60" r="140" fill="#ffffff" opacity="0.08"/>
  <circle cx="80" cy="360" r="110" fill="#ffffff" opacity="0.08"/>
  <g fill="#ffffff" opacity="0.92">
    <!-- buildings -->
    <rect x="215" y="170" width="70" height="130" rx="4"/>
    <rect x="300" y="130" width="80" height="170" rx="4"/>
    <rect x="395" y="190" width="60" height="110" rx="4"/>
    <!-- flagpole -->
    <rect x="160" y="140" width="6" height="160" rx="3"/>
    <path d="M166 140h36l-10 14 10 14h-36z" fill="#ffc107"/>
    <!-- windows -->
    <g fill="#0a3d91" opacity="0.35">
      <rect x="228" y="185" width="14" height="14" rx="2"/><rect x="256" y="185" width="14" height="14" rx="2"/>
      <rect x="228" y="215" width="14" height="14" rx="2"/><rect x="256" y="215" width="14" height="14" rx="2"/>
      <rect x="228" y="245" width="14" height="14" rx="2"/><rect x="256" y="245" width="14" height="14" rx="2"/>
      <rect x="315" y="145" width="16" height="14" rx="2"/><rect x="345" y="145" width="16" height="14" rx="2"/>
      <rect x="315" y="175" width="16" height="14" rx="2"/><rect x="345" y="175" width="16" height="14" rx="2"/>
      <rect x="315" y="205" width="16" height="14" rx="2"/><rect x="345" y="205" width="16" height="14" rx="2"/>
      <rect x="315" y="235" width="16" height="14" rx="2"/><rect x="345" y="235" width="16" height="14" rx="2"/>
      <rect x="408" y="205" width="12" height="12" rx="2"/><rect x="430" y="205" width="12" height="12" rx="2"/>
      <rect x="408" y="232" width="12" height="12" rx="2"/><rect x="430" y="232" width="12" height="12" rx="2"/>
    </g>
    <!-- ground -->
    <rect x="140" y="300" width="340" height="8" rx="4" opacity="0.6"/>
  </g>
  <text x="300" y="360" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="4" fill="#ffffff">CAMPUS MANAGEMENT</text>
</svg>
