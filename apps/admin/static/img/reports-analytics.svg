<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200" role="img" aria-label="Reports and Analytics">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#198754"/>
      <stop offset="1" stop-color="#0a4430"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#bg)"/>
  <circle cx="355" cy="35" r="85" fill="#ffffff" opacity="0.08"/>
  <circle cx="45" cy="175" r="70" fill="#ffffff" opacity="0.08"/>
  <g opacity="0.92">
    <!-- chart panel -->
    <rect x="140" y="42" width="120" height="86" rx="8" fill="#ffffff"/>
    <!-- bars -->
    <rect x="156" y="94" width="16" height="22" rx="3" fill="#198754"/>
    <rect x="180" y="78" width="16" height="38" rx="3" fill="#0d6efd"/>
    <rect x="204" y="60" width="16" height="56" rx="3" fill="#ffc107"/>
    <!-- trend line -->
    <path d="M156 88l26-14 24-12 34-8" fill="none" stroke="#dc3545" stroke-width="4" stroke-linecap="round"/>
    <circle cx="240" cy="54" r="5" fill="#dc3545"/>
  </g>
  <text x="200" y="164" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="3" fill="#ffffff">REPORTS &amp; ANALYTICS</text>
</svg>
