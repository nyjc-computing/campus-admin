{% extends "base.html" %}

{% block title %}Dashboard - Campus Admin Portal{% endblock %}

{% block content %}
<div class="dashboard-welcome shadow-sm">
    <h1 class="mb-3">
        <i class="bi bi-speedometer2 me-2"></i>
        Dashboard
    </h1>
    {% if g.user %}
        <p class="lead mb-0">
            Welcome, <strong>{{ g.user.email }}</strong>
        </p>
        <p class="text-white-50 mb-0">
            <small>User ID: {{ g.user.id }}</small>
        </p>
    {% else %}
        <p class="lead mb-0">Welcome, Guest</p>
        <p class="mb-0">
            <a href="/sign-in" class="btn btn-light mt-3">Sign In to Continue</a>
        </p>
    {% endif %}
</div>

<!-- Dashboard content will go here -->
{% endblock %}
