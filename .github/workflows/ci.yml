name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'

# A new push to an open PR supersedes (cancels) its in-flight run.
# Push runs to main are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Stage 0: style. Cheapest signal (no install needed) and gates everything
  # else. Config lives in pyproject.toml [tool.ruff]; the action pins the same
  # version as the dev dependency so CI and `poetry run ruff` agree.
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Run ruff
        uses: astral-sh/ruff-action@v3
        with:
          version: '0.16.9'

  # Stage 1: install + app-factory smoke test. The Python matrix covers the
  # security tier (3.11-3.13): officially supported per the campus Python
  # support policy. campus-suite weekly and campus-api-python main declare
  # >=3.11,<3.15 because they additionally CI-test bugfix-tier 3.14
  # (allow-to-fail); admin supports the security tier only. Keep the
  # security-tier part of the range in sync across the three.
  smoke:
    name: Smoke Test (${{ matrix.python-version }})
    needs: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    env:
      # Dummy credentials: Campus() runs in server mode and requires these at
      # init; no network calls happen before the smoke assertions.
      SECRET_KEY: ci-smoke
      CLIENT_ID: ci-dummy
      CLIENT_SECRET: ci-dummy
      # Env-only URL resolution (campus-common 0.3.0): no baked-in
      # topology; the app resolves service origins from the env. No
      # network calls happen before the smoke assertions.
      BASE_URL: https://campus.test
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
          restore-keys: venv-${{ runner.os }}-py${{ matrix.python-version }}-
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          # Configure Poetry to use system Python (not its own bundled version)
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true
      - name: Install dependencies
        run: poetry install --with dev
      - name: Run unit tests
        run: poetry run python -m unittest discover -s tests -v
      - name: Verify app factory and routes
        run: |
          poetry run python - <<'EOF'
          from apps.admin import create_app

          app = create_app()
          rules = {str(rule) for rule in app.url_map.iter_rules()}
          expected = {
              "/",
              "/admin",
              "/admin/",
              # flask_campus auth blueprint under the portal namespace
              # flask_campus auth blueprint at root (#95): PrefixFix
              # (flask-campus 0.2.8, fc#50) namespaces it behind the
              # gateway via X-Forwarded-Prefix
              "/login",
              "/finalize_login",
              "/logout",
              # Auth-ops section (campus-admin#97): the /admin/auth
              # namespace. Gated by campus.auth authority
              # (apps.admin.authz): a platform operator or an
              # access-grant holder.
              "/admin/auth/dashboard",
              "/admin/auth/clients",
              "/admin/auth/clients/<client_id>/<action>",
              "/admin/auth/clients/<client_id>/revoke_secret",
              "/admin/auth/users",
              "/admin/auth/sessions",
              "/admin/auth/vaults",
              "/admin/auth/credentials",
              "/admin/auth/grants",
              "/admin/auth/enable",
              "/admin/auth/migrations",
              "/admin/auth/migrations/<service>",
              "/admin/auth/migrations/enable",
              "/admin/auth/migrations/<service>/apply",
              "/admin/auth/migrations/<service>/abort",
              "/admin/auth/migrations/<service>/rollback",
              # API section (campus-admin#97): campus.api resource
              # management, gated per family by the signed-in user's
              # campus.api access
              "/admin/api/",
              "/admin/api/circles",
              "/admin/api/circles/<circle_id>",
              "/admin/api/circles/<circle_id>/<action>",
              "/admin/api/circles/<circle_id>/delete",
              "/admin/api/venues",
              "/admin/api/timetable",
              "/admin/api/timetable/pointers",
              "/admin/api/timetable/<timetable_id>/delete",
              "/admin/api/assignments",
              "/admin/api/submissions",
              "/admin/api/subjcombi",
              "/admin/api/subjcombi/pending/<record_id>/cancel",
              "/admin/api/files",
              "/admin/api/files/content/<path:slug>",
              "/admin/api/files/upload",
              "/admin/api/files/delete",
              "/admin/api/hostedapps",
              "/admin/api/hostedapps/content/<slug>",
              "/admin/api/hostedapps/publish",
              "/admin/api/hostedapps/delete",
              # Audit web UI (apps.admin.audit): /admin/audit namespace
              "/admin/audit/",
              "/admin/audit/traces",
              "/admin/audit/traces/<trace_id>",
              "/admin/audit/journeys/<journey_id>",
              "/admin/audit/keys",
              "/admin/audit/keys/new",
              "/admin/audit/keys/<key_id>/scopes",
              "/admin/audit/keys/<key_id>/rotate",
              "/admin/audit/keys/<key_id>/revoke",
              "/admin/audit/api/traces",
              "/admin/audit/api/journeys/<journey_id>",
              "/admin/audit/api/traces/<trace_id>",
              "/admin/audit/api/traces/<trace_id>/spans/<span_id>",
              # Legacy paths redirect through the transition (#97)
              "/sign-in",
              "/audit",
              "/audit/<path:rest>",
              "/resources",
              "/resources/<path:rest>",
              "/admin/dashboard",
              "/admin/clients",
              "/admin/clients/<path:rest>",
              "/admin/users",
              "/admin/sessions",
              "/admin/vaults",
              "/admin/credentials",
              "/admin/enable",
              "/admin/migrations",
              "/admin/migrations/<path:rest>",
              "/admin/grants",
              "/admin/grants/<path:rest>",
          }
          missing = expected - rules
          assert not missing, f"missing routes: {sorted(missing)}"

          # Retired legacy paths redirect to their remapped homes (#97);
          # bare pre-remap roots that never existed stay 404.
          client = app.test_client()
          assert client.get("/dashboard").status_code == 404
          assert client.get("/clients").status_code == 404
          assert client.post("/users").status_code == 404
          assert client.get("/admin/dashboard").status_code == 302
          assert client.get("/audit/traces").status_code == 302
          assert client.get("/resources/circles").status_code == 302
          print(f"App OK: {len(rules)} routes registered")
          print(f"App OK: {len(rules)} routes registered")
          EOF
