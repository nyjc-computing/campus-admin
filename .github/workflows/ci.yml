name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'

# A new push to an open PR supersedes (cancels) its in-flight run.
# Push runs to main are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Stage 0: style. Cheapest signal (no install needed) and gates everything
  # else. Config lives in pyproject.toml [tool.ruff]; the action pins the same
  # version as the dev dependency so CI and `poetry run ruff` agree.
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Run ruff
        uses: astral-sh/ruff-action@v3
        with:
          version: '0.16.9'

  # Stage 1: install + app-factory smoke test. The Python matrix covers the
  # security tier (3.11-3.13): officially supported per the campus Python
  # support policy. campus-suite weekly and campus-api-python main declare
  # >=3.11,<3.15 because they additionally CI-test bugfix-tier 3.14
  # (allow-to-fail); admin supports the security tier only. Keep the
  # security-tier part of the range in sync across the three.
  smoke:
    name: Smoke Test (${{ matrix.python-version }})
    needs: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    env:
      # Dummy credentials: Campus() runs in server mode and requires these at
      # init; no network calls happen before the smoke assertions.
      SECRET_KEY: ci-smoke
      CLIENT_ID: ci-dummy
      CLIENT_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
          restore-keys: venv-${{ runner.os }}-py${{ matrix.python-version }}-
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          # Configure Poetry to use system Python (not its own bundled version)
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true
      - name: Install dependencies
        run: poetry install --with dev
      - name: Verify app factory and routes
        run: |
          poetry run python - <<'EOF'
          from apps.admin import create_app

          app = create_app()
          rules = {str(rule) for rule in app.url_map.iter_rules()}
          expected = {
              "/",
              "/login",
              "/finalize_login",
              "/logout",
              "/dashboard",
              "/clients",
              "/users",
          }
          missing = expected - rules
          assert not missing, f"missing routes: {sorted(missing)}"
          print(f"App OK: {len(rules)} routes registered")
          EOF
